version: "3.9"

services:
  php:
    build: ./backend
    container_name: olympeak_php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database

  nginx:
    image: nginx:latest
    container_name: olympeak_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  database:
    image: mysql:8.0
    container_name: olympeak_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olympeak
      MYSQL_USER: olympeak
      MYSQL_PASSWORD: olympeak
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: olympeak_phpmyadmin
    restart: always
    environment:
      PMA_HOST: database
      PMA_USER: olympeak
      PMA_PASSWORD: olympeak
    ports:
      - "8080:80"
    depends_on:
      - database

volumes:
  db_data:
